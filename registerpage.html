    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="wrapper">
        <form id="registerForm" action="#" method="POST">
            <h1>Register</h1>
            <div class="input-box">
                <input type="text" id="username" placeholder="Username" required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input type="email" id="email" placeholder="Email" required>
                <i class="bx bxs-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
                <i class="bx bxs-hide password-toggle" data-target="password"></i>
            </div>
            <div class="input-box">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <i class="bx bxs-hide password-toggle" data-target="confirmPassword"></i>
            </div>
            <button type="submit" class="btn">Register</button>
            <div class="register-link">
                <p>Already Have An Account?
                    <a href="login.html">Login Here!</a>
                </p>
            </div>
            <div id="message" style="color: red; text-align: center; margin-top: 10px;"></div>
        </form>
    </div>
    <!-- Link to the new register.js script -->
    <script src="registerpage.js"></script>
</body>
