<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Your existing login.css for styling -->
    <link rel="stylesheet" href="login.css"> 
    <!-- Boxicons for icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Font Awesome for Google icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Basic styling for the message and user info sections */
        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            word-wrap: break-word; /* Ensure long messages wrap */
        }
        .message.success {
            color: #d4edda;
            background-color: #28a745; /* Darker green */
            border: 1px solid #28a745;
        }
        .message.error {
            color: #f8d7da;
            background-color: #dc3545; /* Darker red */
            border: 1px solid #dc3545;
        }
        .user-info {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            color: white; /* Ensure text is visible on the translucent background */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .user-info p {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .user-info strong {
            font-size: 1.2em;
        }
        .user-info.hidden {
            display: none;
        }
        /* Style for the OR divider */
        .or-divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        .or-divider::before,
        .or-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%; /* Adjust width as needed */
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }
        .or-divider::before {
            left: 0;
        }
        .or-divider::after {
            right: 0;
        }
        /* Style for social login button */
        .social-login-btn {
            width: 100%;
            padding: 12px 20px;
            background: #4285F4; /* Google blue */
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .social-login-btn:hover {
            background: #357ae8; /* Darker blue on hover */
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .social-login-btn i {
            font-size: 20px;
        }
        /* Margin top utility */
        .mt-3 {
            margin-top: 15px; /* Consistent margin for buttons */
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <form id="loginForm" action="#" method="POST">
            <h1>Login</h1>
            <div class="input-box">
                <input type="email" id="email" placeholder="Email" required>
                <i class="bx bxs-envelope"></i> 
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
                <i class="bx bxs-hide password-toggle" data-target="password"></i> 
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox" id="rememberMe">Remember Me </label>
                <a href="forgotpassword.html" id="forgotPassword">Forgot Password?</a>
            </div>
            <button type="submit" class="btn" id="login-button">Login</button>
            <!-- Register button removed as per user request -->
            <!-- <button type="button" class="btn mt-3" id="register-button">Register</button> -->

            <div class="or-divider">OR</div>

            <button type="button" class="social-login-btn" id="google-login-button">
                <i class="fab fa-google"></i> Login with Google
            </button>
            
            <div class="register-link">
                <p>Don't Have An Account
                    <a href="registerpage.html" id="registerLink">Register Here!</a>
                </p>
            </div>

            <div id="message" class="message"></div>
            <div id="user-info" class="user-info hidden">
                <p><strong>Welcome!</strong></p>
                <p>User ID: <span id="user-id"></span></p>
                <p>Email: <span id="user-email"></span></p>
                <button type="button" class="btn mt-3" id="logout-button">Logout</button>
            </div>
        </form>
    </div>

    <script type="module">
        // Mandatory global variables for Canvas environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyCZfgx6cHonWeozfD5b884XAYP-ysqElfA",
            authDomain: "giftoji-website.firebaseapp.com",
            projectId: "giftoji-website",
            storageBucket: "giftoji-website.firebasestorage.app",
            messagingSenderId: "834983071793",
            appId: "1:834983071793:web:144ecf08af3fdcd4488510",
            measurementId: "G-ZQTWHE56CC"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Import Firebase services
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut,
            onAuthStateChanged,
            signInAnonymously // For initial anonymous sign-in if no custom token
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc 
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        // Initialize Firebase app
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginButton = document.getElementById('login-button');
        // const registerButton = document.getElementById('register-button'); // Removed as per user request
        const googleLoginButton = document.getElementById('google-login-button');
        const logoutButton = document.getElementById('logout-button');
        const messageDiv = document.getElementById('message');
        const userInfoDiv = document.getElementById('user-info');
        const userIdSpan = document.getElementById('user-id');
        const userEmailSpan = document.getElementById('user-email');
        const passwordToggle = document.querySelector('.password-toggle');

        // Function to display messages
        function displayMessage(msg, type = 'success') {
            messageDiv.textContent = msg;
            messageDiv.className = `message ${type}`; // Apply success or error class
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = 'message';
            }, 5000);
        }

        // Function to update UI based on auth state
        function updateUIForUser(user) {
            if (user) {
                // User is signed in
                userInfoDiv.classList.remove('hidden');
                loginForm.classList.add('hidden'); // Hide login form
                userIdSpan.textContent = user.uid;
                userEmailSpan.textContent = user.email || 'N/A';
            } else {
                // User is signed out
                userInfoDiv.classList.add('hidden');
                loginForm.classList.remove('hidden'); // Show login form
                userIdSpan.textContent = '';
                userEmailSpan.textContent = '';
            }
        }

        // --- Firebase Authentication Listeners ---
        // Listen for auth state changes
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log("User is signed in:", user.uid);
                updateUIForUser(user);
                // Automatically save user data to Firestore
                await saveUserData(user);
            } else {
                console.log("No user is signed in.");
                updateUIForUser(null);
            }
        });

        // Initial anonymous sign-in if custom token is not provided
        // This ensures Firestore rules that require `request.auth != null` can work
        async function initializeAuth() {
            if (initialAuthToken) {
                try {
                    await signInWithCustomToken(auth, initialAuthToken);
                    console.log("Signed in with custom token.");
                } catch (error) {
                    console.error("Error signing in with custom token:", error);
                    displayMessage(`Error: ${error.message}`, 'error');
                    // Fallback to anonymous if custom token fails
                    try {
                        await signInAnonymously(auth);
                        console.log("Signed in anonymously as fallback.");
                    } catch (anonError) {
                        console.error("Error signing in anonymously:", anonError);
                        displayMessage(`Error: Anonymous sign-in failed. ${anonError.message}`, 'error');
                    }
                }
            } else {
                try {
                    await signInAnonymously(auth);
                    console.log("Signed in anonymously.");
                } catch (error) {
                    console.error("Error signing in anonymously:", error);
                    displayMessage(`Error: Anonymous sign-in failed. ${error.message}`, 'error');
                }
            }
        }

        initializeAuth();

        // --- Data Saving to Firestore ---
        /**
         * Saves or updates user profile data in Firestore.
         * Data is stored under artifacts/{appId}/users/{userId}/profile/userProfile
         * This path adheres to Firestore security rules for private user data.
         * @param {firebase.User} user The Firebase User object.
         */
        async function saveUserData(user) {
            if (!user || !user.uid) {
                console.warn("No user or UID to save data to Firestore.");
                return;
            }

            // Construct the document reference using the required path for private data
            // /artifacts/{appId}/users/{userId}/{your_collection_name}/{documentId}
            const userDocRef = doc(db, `artifacts/${appId}/users/${user.uid}/profile`, 'userProfile');
            
            try {
                // Check if the user's profile document already exists
                const docSnap = await getDoc(userDocRef);

                if (!docSnap.exists()) {
                    // If the document does not exist, create it
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || 'Anonymous User', // Use display name if available (e.g., from Google OAuth)
                        createdAt: new Date().toISOString() // Timestamp of creation
                    });
                    console.log("New user data saved to Firestore for UID:", user.uid);
                    displayMessage("User profile created!");
                } else {
                    // If the document exists, update it (e.g., if displayName changes after Google login)
                    // The merge: true option is typically used with setDoc to merge data,
                    // but since we checked for existence, a direct update might be more explicit for specific fields.
                    // For simplicity, we just log that it already exists if no new data needs merging here explicitly.
                    console.log("User profile already exists for UID:", user.uid);
                    // You could add updateDoc here if specific fields need refreshing (e.g., last login time)
                    // await updateDoc(userDocRef, { lastLoginAt: new Date().toISOString() });
                }
            } catch (e) {
                console.error("Error saving user data to Firestore:", e);
                displayMessage(`Error saving profile: ${e.message}`, 'error');
            }
        }

        // --- Event Listeners for Authentication ---

        // Email/Password Login
        loginButton.addEventListener('click', async (e) => {
            e.preventDefault(); // Prevent default form submission
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                displayMessage("Please enter both email and password.", "error");
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                displayMessage(`Logged in successfully as ${user.email}!`);
                // Data saving handled by onAuthStateChanged listener
            } catch (error) {
                console.error("Login failed:", error.code, error.message);
                let errorMessage = "Login failed. Please check your credentials.";
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMessage = "Invalid email or password.";
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = "Invalid email format.";
                }
                displayMessage(errorMessage, 'error');
            }
        });

        // Email/Password Register - This functionality is now removed with the button.
        /*
        registerButton.addEventListener('click', async (e) => {
            e.preventDefault(); // Prevent default form submission
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                displayMessage("Please enter both email and password.", "error");
                return;
            }
            
            if (password.length < 6) {
                displayMessage("Password should be at least 6 characters.", "error");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                displayMessage(`Successfully registered and logged in as ${user.email}!`);
                // Data saving handled by onAuthStateChanged listener
            } catch (error) {
                console.error("Registration failed:", error.code, error.message);
                let errorMessage = "Registration failed.";
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = "Email already in use. Try logging in or use a different email.";
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = "Invalid email format.";
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = "Password is too weak. Please choose a stronger password.";
                }
                displayMessage(errorMessage, 'error');
            }
        });
        */

        // Google OAuth Login
        googleLoginButton.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                const userCredential = await signInWithPopup(auth, provider);
                const user = userCredential.user;
                displayMessage(`Logged in with Google as ${user.displayName || user.email}!`);
                // Data saving handled by onAuthStateChanged listener
            } catch (error) {
                console.error("Google login failed:", error.code, error.message);
                let errorMessage = "Google login failed.";
                if (error.code === 'auth/popup-closed-by-user') {
                    errorMessage = "Google login was cancelled.";
                } else if (error.code === 'auth/cancelled-popup-request') {
                    errorMessage = "Popup blocked or already open. Please try again.";
                }
                displayMessage(errorMessage, 'error');
            }
        });

        // Logout
        logoutButton.addEventListener('click', async () => {
            try {
                await signOut(auth);
                displayMessage("Logged out successfully.");
            } catch (error) {
                console.error("Logout failed:", error.message);
                displayMessage(`Logout failed: ${error.message}`, 'error');
            }
        });

        // Password Toggle Visibility
        if (passwordToggle && passwordInput) {
            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);

                // Toggle icon
                passwordToggle.classList.toggle('bx-bxs-hide');
                passwordToggle.classList.toggle('bx-bxs-show');
            });
        }

        // Basic client-side persistence for "Remember Me" (if needed, this is from your original login.js)
        // const rememberMeCheckbox = document.getElementById('rememberMe');
        // if (localStorage.getItem('email')) { // Changed from 'username' to 'email'
        //     emailInput.value = localStorage.getItem('email');
        //     rememberMeCheckbox.checked = true;
        // }
        // Note: For 'Remember Me' with Firebase, Firebase handles session persistence automatically.
        // This local storage part is more for pre-filling the email field.

        // Event Listeners for other links (from your original login.js)
        const forgotPasswordLink = document.getElementById('forgotPassword');
        const registerLink = document.getElementById('registerLink');

        if (forgotPasswordLink) {
            forgotPasswordLink.addEventListener('click', (event) => {
                console.log('Forgot Password clicked.');
                // In a real app: Redirect to a password reset page or open a modal
            });
        }

        if (registerLink) {
            registerLink.addEventListener('click', (event) => {
                console.log('Register Link clicked.');
                // In a real app: Redirect to the registration page
            });
        }
    </script>
</body>
</html>
